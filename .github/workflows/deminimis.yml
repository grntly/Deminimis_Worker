name: Deminimis Batch Scraper

on:
  workflow_dispatch:
    inputs:
      batch_payload:
        description: "JSON payload containing shared callback settings and one or more jobs"
        required: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.53.0-jammy
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --omit=dev --no-audit --no-fund

      - name: Run batch scraper in one runner
        env:
          BATCH_PAYLOAD: ${{ github.event.inputs.batch_payload }}
        run: node .github/scripts/run-dispatch.mjs
