name: Deminimis Batch Scraper

on:
  workflow_dispatch:
    inputs:
      batch_payload:
        description: "JSON payload containing shared callback settings and one or more jobs"
        required: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run batch scraper in one runner
        env:
          BATCH_PAYLOAD: ${{ github.event.inputs.batch_payload }}
        run: node .github/scripts/run-dispatch.mjs
